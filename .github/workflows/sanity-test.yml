name: Sanity test (backend + frontend)

on:
  push:
    branches: [ main, sprint-*, po* ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/sanity-test.yml"
  pull_request:
    branches: [ main, sprint-*, po* ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/sanity-test.yml"

jobs:
  backend:
    name: Backend sanity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps + pre-commit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pre-commit

      - name: Verify backend.main imports
        working-directory: backend
        run: python -c "import main"

      - name: Run backend tests (schema + contracts + stripe)
        working-directory: backend
        run: |
          pytest tests/test_schema_guard.py
          pytest tests/test_contracts.py tests/test_properties_routes.py tests/test_stripe_trial.py

      - name: Run pre-commit (skip offmarket import hook in CI)
        working-directory: backend
        env:
          SKIP: offmarket-import-all
        run: |
          pre-commit run --all-files --show-diff-on-failure

  frontend:
    name: Frontend sanity
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint + build
        working-directory: frontend
        run: |
          npm run lint
          npm run build
