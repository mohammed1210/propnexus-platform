name: Sanity test (backend + frontend)

on:
  workflow_dispatch:
    branches: [ main, sprint-*, po* ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/sanity-test.yml"

jobs:
  backend:
    name: Backend sanity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Secrets may be empty on PRs from forks; keep safe defaults so workflow doesn't explode.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend deps + pre-commit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

          # CI guard for scraper imports (you hit "No module named aiohttp")
          pip install "aiohttp==3.13.2"
          python -c "import aiohttp; print('aiohttp:', aiohttp.__version__)"

          pip install pre-commit pytest

      - name: Verify backend.main imports
        working-directory: .
        run: python -c "import backend.main; print('✅ imported backend.main')"

      - name: Run backend tests (pytest discovery)
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Avoid hardcoding paths that may move (you hit tests/test_schema_guard.py not found)
          pytest -q

      - name: Run pre-commit (skip offmarket import hook in CI)
        working-directory: .
        env:
          SKIP: offmarket-import-all,offmarket-import
        run: |
          pre-commit run --all-files --show-diff-on-failure

  frontend:
    name: Frontend sanity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure npm compatibility
        run: |
          npm i -g npm@10.8.2
          echo "Using Node $(node -v) and npm $(npm -v)"

      - name: Install frontend deps
        working-directory: frontend
        run: |
          set -e
          if npm ci --prefer-offline; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed; falling back to npm install"
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Lint
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run type-check

      - name: Build (with CI-safe env)
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"

          # Supabase placeholders so Next.js doesn't crash on missing NEXT_PUBLIC vars
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'anon_placeholder_key' }}

          # Backend placeholder for build-time env usage
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'https://example.com' }}

          # Clerk: prevent prerender crash on /magic-login by providing a key-shaped value
          # If you have real secrets, they will override these.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_0123456789abcdefghijklmnopqrstuvwxyz0123456789' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_0123456789abcdefghijklmnopqrstuvwxyz0123456789' }}
        run: npm run build