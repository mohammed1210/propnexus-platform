name: Scraper Monitor

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets sanity check
        env:
          API_BASE: ${{ secrets.API_BASE }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          if [ -z "$API_BASE" ] && [ -z "$NEXT_PUBLIC_BACKEND_URL" ]; then
            echo "ℹ️ API_BASE / NEXT_PUBLIC_BACKEND_URL not configured – skipping monitor run (soft pass)."
            exit 0
          fi

      - name: Health check
        env:
          API_BASE: ${{ secrets.API_BASE }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          BACKEND_BASE="$API_BASE"
          if [ -z "$BACKEND_BASE" ]; then
            BACKEND_BASE="$NEXT_PUBLIC_BACKEND_URL"
          fi
          if [ -z "${BACKEND_BASE}" ]; then
            echo "⚠️ BACKEND_BASE not configured – skipping monitor run (soft pass)."
            exit 0
          fi

          echo "🔍 Checking API health at $BACKEND_BASE/health..."
          set -e
          HEALTH_RESPONSE=$(curl -s -f "${BACKEND_BASE}/health")
          echo "✅ Health check passed: $HEALTH_RESPONSE"

      - name: Test import with Ilford
        env:
          API_BASE: ${{ secrets.API_BASE }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          OFF_MARKET_ADMIN_TOKEN: ${{ secrets.OFF_MARKET_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          BACKEND_BASE="${API_BASE:-}"
          if [ -z "$BACKEND_BASE" ]; then
            BACKEND_BASE="${NEXT_PUBLIC_BACKEND_URL:-}"
          fi
          if [ -z "${BACKEND_BASE}" ]; then
            echo "⚠️ BACKEND_BASE not configured – skipping import test (soft pass)."
            exit 0
          fi

          if [ -z "${OFF_MARKET_ADMIN_TOKEN:-}" ]; then
            echo "❌ OFF_MARKET_ADMIN_TOKEN secret is missing/empty."
            exit 1
          fi

          echo "🔄 Testing import with Ilford at $BACKEND_BASE/import/all..."

          urlencode() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$1"
          }
          ENC_LOCATION="$(urlencode "Ilford")"

          # Capture status + body (don’t use -f so we can see the error body)
          HTTP_STATUS=$(curl -sS -o /tmp/import_body.json -w "%{http_code}" -X POST \
            "${BACKEND_BASE}/import/all?req=${ENC_LOCATION}" \
            -H "x-admin-token: ${OFF_MARKET_ADMIN_TOKEN}" \
            -H "Content-Type: application/json")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Body:"
          cat /tmp/import_body.json
          echo ""

          # Now enforce success
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ Import endpoint failed (HTTP $HTTP_STATUS). Likely token mismatch if 401."
            exit 1
          fi

          COUNT=$(jq -r '.total_imported // .count // 0' /tmp/import_body.json)
          echo "📊 Import count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ WARNING: Import returned 0 results for Ilford"
            echo "This may indicate scraper issues - please investigate"
            exit 1
          fi

          echo "✅ Monitor check passed with $COUNT properties"
