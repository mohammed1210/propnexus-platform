name: Scraper Monitor

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets sanity check
        env:
          API_BASE: ${{ secrets.API_BASE }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          if [ -z "$API_BASE" ] && [ -z "$NEXT_PUBLIC_BACKEND_URL" ]; then
            echo "ℹ️ API_BASE / NEXT_PUBLIC_BACKEND_URL not configured – skipping monitor run (soft pass)."
            exit 0
          fi

      - name: Health check
        env:
          API_BASE: ${{ secrets.API_BASE }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: |
          BACKEND_BASE="$API_BASE"
          if [ -z "$BACKEND_BASE" ]; then
            BACKEND_BASE="$NEXT_PUBLIC_BACKEND_URL"
          fi
          if [ -z "${BACKEND_BASE}" ]; then
            echo "⚠️ BACKEND_BASE not configured – skipping monitor run (soft pass)."
            exit 0
          fi

          echo "🔍 Checking API health at $BACKEND_BASE/health..."
          set -e
          HEALTH_RESPONSE=$(curl -s -f "${BACKEND_BASE}/health")
          echo "✅ Health check passed: $HEALTH_RESPONSE"

      - name: Test import with Ilford
        env:
          API_BASE: ${{ secrets.API_BASE }}
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
          OFF_MARKET_ADMIN_TOKEN: ${{ secrets.OFF_MARKET_ADMIN_TOKEN }}
        run: |
          BACKEND_BASE="$API_BASE"
          if [ -z "$BACKEND_BASE" ]; then
            BACKEND_BASE="$NEXT_PUBLIC_BACKEND_URL"
          fi
          if [ -z "${BACKEND_BASE}" ]; then
            echo "⚠️ BACKEND_BASE not configured – skipping import test (soft pass)."
            exit 0
          fi

          echo "🔄 Testing import with Ilford at $BACKEND_BASE/import/all..."

          set -e
          RESPONSE=$(curl -s -f -X POST \
            "${BACKEND_BASE}/import/all" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${OFF_MARKET_ADMIN_TOKEN}" \
            -d '{"location": "Ilford"}')

          echo "Response: $RESPONSE"

          COUNT=$(echo "$RESPONSE" | jq -r '.count // 0')

          echo "📊 Import count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ WARNING: Import returned 0 results for Ilford"
            echo "This may indicate scraper issues - please investigate"
            exit 1
          fi

          echo "✅ Monitor check passed with $COUNT properties"
