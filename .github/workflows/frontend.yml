name: Frontend CI (Typecheck + Lint + Build)

on:
  push:
    branches: [ main, sprint-* ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck + Lint + Build
        run: |
          npm run typecheck --if-present
          npm run lint --if-present
          npm run build

      - name: Lightweight smoke test
        run: |
          echo "Starting Next.js server in background..."
          npm run start &
          SERVER_PID=$!
          sleep 10
          echo "Testing root endpoint..."
          curl -f http://localhost:3000/ || (echo "Smoke test failed"; kill $SERVER_PID; exit 1)
          echo "Smoke test passed!"
          kill $SERVER_PID
