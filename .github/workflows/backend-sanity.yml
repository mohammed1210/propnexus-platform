name: Backend Sanity Check

on:
  push:
    branches: [main, po3/stripe-paywall-tiers]
  pull_request:
    branches: [main, po3/stripe-paywall-tiers]

jobs:
  sanity-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify backend.main imports
        working-directory: .
        run: |
          source venv/bin/activate
          python -c "import backend.main; print('✅ backend.main import successful.')"

      - name: Report success
        if: success()
        run: echo "All good — backend package loads cleanly."