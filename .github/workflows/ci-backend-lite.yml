name: CI – backend import (lite)

on:
  workflow_dispatch:
    branches: [ "All-Green" ]

jobs:
  backend_import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (best-effort)
        run: |
          if [ -f backend/requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r backend/requirements.txt
          fi

      - name: Smoke import
        working-directory: .
        run: |
          python -c "import backend.main; print('✅ OK: backend imports passed')"