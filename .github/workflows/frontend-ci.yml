name: Continuous Integration

on:
  push:
    branches: [ main, po2, "**" ]
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect frontend directory
        id: fe
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f frontend/package.json ]; then
            echo "dir=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "No package.json found at repo root or frontend/"; exit 0
          fi

      - name: Setup Node.js
        if: steps.fe.outputs.dir != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            yarn.lock
            frontend/yarn.lock
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Enable Corepack (pnpm/yarn)
        if: steps.fe.outputs.dir != ''
        run: corepack enable

      - name: Install dependencies
        if: steps.fe.outputs.dir != ''
        working-directory: ${{ steps.fe.outputs.dir }}
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found; running npm install"
            npm install
          fi

      - name: Type check (if script exists)
        if: steps.fe.outputs.dir != ''
        working-directory: ${{ steps.fe.outputs.dir }}
        shell: bash
        run: |
          if jq -e '.scripts.typecheck' package.json >/dev/null; then
            pnpm run typecheck 2>/dev/null || yarn run typecheck 2>/dev/null || npm run typecheck 2>/dev/null
          else
            npx --yes tsc -v || echo "tsc not found (skipping)"
          fi

      - name: Lint (if script exists)
        if: steps.fe.outputs.dir != ''
        working-directory: ${{ steps.fe.outputs.dir }}
        shell: bash
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null; then
            pnpm run lint 2>/dev/null || yarn run lint 2>/dev/null || npm run lint 2>/dev/null
          else
            # Fallback for Next.js repos with no "lint" script
            npx --yes next --version >/dev/null 2>&1 && npx --yes next lint || echo "No lint script; skipping"
          fi

      - name: Build (if script exists)
        if: steps.fe.outputs.dir != ''
        working-directory: ${{ steps.fe.outputs.dir }}
        shell: bash
        run: |
          if jq -e '.scripts.build' package.json >/dev/null; then
            pnpm run build 2>/dev/null || yarn run build 2>/dev/null || npm run build 2>/dev/null
          else
            echo "No build script; skipping"
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff==0.6.7 black==24.8.0 pytest==8.3.3

      - name: Lint (ruff + black --check)
        run: |
          ruff .
          black --check .

      - name: Run tests (if any)
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          if ls -1 *_test.py tests 2>/dev/null | grep -q '.'; then
            pytest -q
          else
            echo "No tests found; skipping"
          fi