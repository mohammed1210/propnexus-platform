name: Frontend CI

on:
  pull_request:
  push:
    branches: [ main, sprint-*, po* ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure npm compatibility
        run: |
          npm i -g npm@9
          echo "Using Node $(node -v) and npm $(npm -v)"

      - name: Install dependencies
        run: |
          set -e
          if npm ci --prefer-offline; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed; falling back to npm install"
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Verify jose installed
        run: node -e "console.log('✅ jose version:', require('jose/package.json').version)"

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Run Jest tests
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm test
        