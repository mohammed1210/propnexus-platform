name: Frontend CI

on:
  workflow_dispatch:

jobs:
  frontend_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure npm compatibility
        run: |
          npm i -g npm@10.8.2
          echo "Using Node $(node -v) and npm $(npm -v)"

      - name: Install dependencies
        run: |
          set -e
          if npm ci --prefer-offline; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed; falling back to npm install"
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Type-check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run type-check

      - name: Lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run lint

      - name: Verify jose installed (debug)
        run: node -e "console.log('✅ jose version:', require('jose/package.json').version)"

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "anon_placeholder_key"
          NEXT_PUBLIC_BACKEND_URL: "https://example.com"

          # 🔥 Key change: disable auth in CI so Clerk never runs at build-time
          NEXT_PUBLIC_DISABLE_AUTH: "1"

          # Optional: still pass if you want, but not required anymore
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: npm run build
