name: Frontend CI

on:
  push:
    branches: [ main, po2 ]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack (pnpm/yarn shim)
        run: corepack enable

      - name: Install deps (yarn)
        run: yarn install --frozen-lockfile

      - name: Type check (if script exists)
        run: |
          if jq -e '.scripts.typecheck' package.json >/dev/null; then
            yarn run typecheck
          else
            echo "no typecheck script"
          fi

      - name: Lint (if script exists)
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null; then
            yarn run lint
          else
            echo "no lint script"
          fi

      - name: Build (if script exists)
        run: |
          if jq -e '.scripts.build' package.json >/dev/null; then
            yarn run build
          else
            echo "no build script"
          fi