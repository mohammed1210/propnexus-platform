name: Frontend CI

on:
  push:
    branches: [ main, po2 ]
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm/yarn shims)
        run: corepack enable

      - name: Install dependencies (auto-detect)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "Using pnpm"
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            echo "Using yarn"
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            echo "Using npm ci"
            npm ci
          else
            echo "No lockfile found; using npm install"
            npm install
          fi

      - name: Type check (if script exists)
        run: |
          if jq -e '.scripts.typecheck' package.json >/dev/null; then
            pnpm run typecheck 2>/dev/null || yarn run typecheck 2>/dev/null || npm run typecheck
          else
            echo "No typecheck script; skipping"
          fi

      - name: Lint (if script exists)
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null; then
            pnpm run lint 2>/dev/null || yarn run lint 2>/dev/null || npm run lint
          else
            echo "No lint script; skipping"
          fi

      - name: Build (if script exists)
        run: |
          if jq -e '.scripts.build' package.json >/dev/null; then
            pnpm run build 2>/dev/null || yarn run build 2>/dev/null || npm run build
          else
            echo "No build script; skipping"
          fi