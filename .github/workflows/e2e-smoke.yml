name: E2E Smoke

on:
  pull_request:
    branches: [ "main", "All-Green" ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Backend deps
        run: pip install -r backend/requirements.txt
      - name: Start backend
        run: nohup uvicorn backend.main:app --port 8000 &
      - uses: actions/setup-node@v4
      - name: Install + Build
        working-directory: frontend
        run: |
          npm ci
          npm i leaflet @types/leaflet --force
          npm run build
      - name: Wait for servers
        run: |
          for i in {1..40}; do curl -fs http://localhost:8000/properties && break || sleep 2; done
          for i in {1..40}; do curl -fs http://localhost:3000 && break || sleep 2; done
      - name: Run Playwright (non-fatal)
        working-directory: frontend
        env:
          E2E_BASE_URL: "http://localhost:3000"
        run: |
          npx --yes @playwright/test@1.48.0 install --with-deps || true
          npx --yes @playwright/test@1.48.0 test --reporter=list || true
