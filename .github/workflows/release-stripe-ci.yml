name: Release • Stripe Smoke

on:
  workflow_dispatch:
    branches:
      - main

permissions:
  contents: read

jobs:
  stripe-smoke:
    name: Stripe & Pricing Smoke
    runs-on: ubuntu-latest

    env:
      # Provide these via GitHub “Repository variables / secrets”
      # Vars (preferred): Settings → Variables → Actions
      # Secrets: Settings → Secrets → Actions
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS: ${{ vars.NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS }}
      BASE_URL: ${{ vars.RELEASE_BASE_URL || secrets.RELEASE_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Stripe smoke checks
        run: |
          if [ -z "${STRIPE_SECRET_KEY}" ]; then
            echo "⚠️ STRIPE_SECRET_KEY not set – skipping smoke checks (passing)."; exit 0; fi
          if [ -z "${NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS}" ]; then
            echo "⚠️ NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS not set – skipping detailed price validation."; fi
          node ./frontend/ops/smoke/stripe-check.mjs || { echo "⚠️ Non-critical Stripe smoke failure (soft pass)"; exit 0; }