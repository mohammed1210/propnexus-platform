name: Demo Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Capture screenshots
        run: npm run screenshots

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: frontend/public/images/demo/screenshots/
          retention-days: 30

      - name: Create Pull Request with updated screenshots
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(demo): update generated screenshots'
          branch: auto/demo-screenshots
          delete-branch: true
          title: 'Update demo screenshots'
          body: |
            ## Automated Screenshot Update
            
            This PR contains updated screenshots captured from the demo pages:
            
            - **Demo Landing Page** (`/demo`)
            - **Investment Analytics** (`/property/<demo-id>`) - calculator section
            - **Local Tradesmen Services** (`/property/<demo-id>`) - tradesmen section
            - **AI Deal Score** (`/property/<demo-id>`) - score section
            - **Area Intel** (`/property/<demo-id>`) - area insights section
            
            Screenshots were captured in dark mode for brand consistency.
            
            ### Files Updated
            - `frontend/public/images/demo/screenshots/demo-landing.png`
            - `frontend/public/images/demo/screenshots/premium-analytics.png`
            - `frontend/public/images/demo/screenshots/premium-tradesmen.png`
            - `frontend/public/images/demo/screenshots/premium-ai-score.png`
            - `frontend/public/images/demo/screenshots/premium-area-intel.png`
            
            **Generated by**: Demo Screenshots workflow
          labels: |
            automated
            demo
            screenshots
