name: Demo Screenshots

on:
  workflow_dispatch:

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Capture screenshots
        run: npm run screenshots

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshots
          path: frontend/public/images/demo/screenshots/
          retention-days: 30

      - name: Create Pull Request with updated screenshots
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(demo): update generated screenshots'
          branch: auto/demo-screenshots
          delete-branch: true
          title: 'Update demo screenshots'
          body: |
            ## Automated Screenshot Update
            
            This PR contains updated screenshots captured from the demo pages:
            
            - **Demo Landing Page** (`/demo`)
            - **Premium Demo 1** (`/demo/property/demo-1`) - Investment Analytics
            - **Premium Demo 2** (`/demo/property/demo-2`) - Local Tradesmen Services
            - **Premium Demo 3** (`/demo/property/demo-3`) - AI Deal Score + Area Intel
            
            Screenshots were captured in dark mode for brand consistency.
            
            ### Files Updated
            - `frontend/public/images/demo/screenshots/demo-landing.png`
            - `frontend/public/images/demo/screenshots/premium-demo-1.png`
            - `frontend/public/images/demo/screenshots/premium-demo-2.png`
            - `frontend/public/images/demo/screenshots/premium-demo-3.png`
            
            **Generated by**: Demo Screenshots workflow
          labels: |
            automated
            demo
            screenshots
