name: System Health Report

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: 'Frontend base URL (e.g., https://propnexus-platform.vercel.app)'
        required: true
      backend_url:
        description: 'Backend base URL (e.g., https://your-backend.example.com)'
        required: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run report
        run: |
          FRONTEND_URL="${{ github.event.inputs.frontend_url }}" \
          BACKEND_URL="${{ github.event.inputs.backend_url }}" \
          node scripts/system-health-report.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-health-report
          path: SYSTEM_HEALTH_REPORT.md
