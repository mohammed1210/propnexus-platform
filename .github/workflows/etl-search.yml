name: ETL Search Features

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  etl-search-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_URL_RW || secrets.POSTGRES_URL || secrets.POSTGRESQL_URL }}
      SUPABASE_URL_RW: ${{ secrets.SUPABASE_URL_RW }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRESQL_URL: ${{ secrets.POSTGRESQL_URL }}
      SMART_SEARCH_FEATURES_PREFIX: ${{ secrets.SMART_SEARCH_FEATURES_PREFIX }}
      ML_MODEL_BUCKET: ${{ secrets.ML_MODEL_BUCKET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETL deps
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg pandas pyarrow boto3

      - name: Validate database DSN
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" && -z "${SUPABASE_URL_RW:-}" && -z "${POSTGRES_URL:-}" && -z "${POSTGRESQL_URL:-}" ]]; then
            echo "Missing database DSN secret. Set one of DATABASE_URL, SUPABASE_URL_RW, POSTGRES_URL, or POSTGRESQL_URL." >&2
            exit 1
          fi

      - name: Resolve output prefix
        run: |
          set -euo pipefail

          prefix="${SMART_SEARCH_FEATURES_PREFIX:-}"
          if [[ -z "$prefix" && -n "${ML_MODEL_BUCKET:-}" ]]; then
            prefix="s3://${ML_MODEL_BUCKET}/features"
          fi
          if [[ -z "$prefix" ]]; then
            prefix="$RUNNER_TEMP/search-features"
          fi

          if [[ "$prefix" == s3://* ]]; then
            bucket="${prefix#s3://}"
            bucket="${bucket%%/*}"
            if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
              echo "S3 bucket $bucket is not accessible; falling back to local artifact output." >&2
              prefix="$RUNNER_TEMP/search-features"
            fi
          fi

          echo "SMART_SEARCH_FEATURES_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "Resolved SMART_SEARCH_FEATURES_PREFIX=$prefix"

      - name: Build daily search features parquet
        run: |
          python analytics/etl/search_clicks_to_parquet.py

      - name: Upload ETL artifact
        if: ${{ !startsWith(env.SMART_SEARCH_FEATURES_PREFIX, 's3://') }}
        uses: actions/upload-artifact@v4
        with:
          name: search-features-${{ github.run_id }}
          path: ${{ env.SMART_SEARCH_FEATURES_PREFIX }}
          if-no-files-found: error
