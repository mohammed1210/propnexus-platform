name: ETL Search Features

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  etl-search-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMART_SEARCH_FEATURES_PREFIX: s3://propnexus-ml/features
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ETL deps
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg pandas pyarrow boto3

      - name: Build daily search features parquet
        run: |
          python analytics/etl/search_clicks_to_parquet.py
