name: Backend CI
on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches:
      - main
      - sprint-*
      - po3/**
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Import check
        working-directory: backend
        run: python -c "import importlib; importlib.import_module('fastapi')"
      - name: Verify new routes import
        working-directory: backend
        run: |
          python -c "from routes.stripe_routes import router; print('✓ stripe_routes')"
          python -c "from routes.stripe_webhook import router; print('✓ stripe_webhook')"
          python -c "from routes.users_routes import router; print('✓ users_routes')"
