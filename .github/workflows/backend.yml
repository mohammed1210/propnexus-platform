name: Backend CI
on:
  workflow_dispatch:
    branches:
      - main
      - sprint-*
      - po3/**
jobs:
  backend_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Import check
        working-directory: backend
        run: python -c "import importlib; importlib.import_module('fastapi')"
      
      - name: Python syntax check
        working-directory: backend
        run: python -m py_compile main.py routes/*.py
        continue-on-error: true
      
      - name: Smoke Test (Start Server)
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          sleep 5
          curl -f http://localhost:8000/ || (echo "Smoke test failed" && kill $SERVER_PID && exit 1)
          kill $SERVER_PID || true
        continue-on-error: true
