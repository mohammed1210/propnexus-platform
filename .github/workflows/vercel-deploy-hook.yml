name: Vercel Deploy Hook

on:
  push:
    branches:
      - payments-merge
      - sprint7/payments

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Deploy Hook
        run: |
          curl -fsSL -X POST \
            "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
