name: Deploy Frontend (Vercel Hook)

on:
  push:
    branches:
      - main
      - 'sprint-*'
      - 'release/**'

jobs:
  ping-vercel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep runner environment consistent
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Call Vercel Deploy Hook
        env:
          HOOK:   ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          BRANCH: ${{ github.ref_name }}
          SHA:    ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "ℹ️ VERCEL_DEPLOY_HOOK_URL not set – skipping deploy hook (job will pass)."; exit 0
          fi
          json=$(printf '{"branch":"%s","sha":"%s"}' "$BRANCH" "$SHA")
          curl -fsS -X POST "$HOOK" \
            -H "Content-Type: application/json" \
            -H "x-vercel-protection-bypass: ${BYPASS:-}" \
            --data "$json"