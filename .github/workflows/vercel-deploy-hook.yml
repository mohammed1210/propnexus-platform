name: Deploy Preview via Vercel Hook

on:
  push:
    branches:
      - sprint7/payments
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook (bypass protection)
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" \
            "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}?force=1"# Move (or create) the branch pointer at the current commit and switch to it