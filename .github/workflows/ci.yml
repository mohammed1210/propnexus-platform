name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          # Enable built-in caching for pnpm/yarn/npm
          cache: 'pnpm'
      - name: Install dependencies
        run: |
          # Use pnpm if available, fallback to yarn, then npm
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found in frontend directory" && exit 1
          fi
      - name: Type check
        run: |
          # Run typecheck script if present; otherwise, attempt tsc
          if [ -f package.json ] && jq -e '.scripts["typecheck"]' package.json > /dev/null; then
            pnpm run typecheck || yarn run typecheck || npm run typecheck || true
          else
            # Fallback: show TypeScript compiler version if available
            npx tsc -v || echo "tsc not found"
          fi
      - name: Lint and build
        run: |
          # Lint if script exists
          if [ -f package.json ] && jq -e '.scripts["lint"]' package.json > /dev/null; then
            pnpm run lint || yarn run lint || npm run lint
          fi
          # Build if script exists
          if [ -f package.json ] && jq -e '.scripts["build"]' package.json > /dev/null; then
            pnpm run build || yarn run build || npm run build
          else
            echo "No build script found, skipping build"
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Lint code
        run: |
          # Ruff for linting
          ruff .
          # Black for formatting check
          black --check .
      - name: Run tests
        run: |
          if [ -d tests ] || ls -1 *_test.py tests 2>/dev/null | grep -q '.'; then
            pytest -q
          else
            echo "No tests found, skipping pytest"
          fi
          