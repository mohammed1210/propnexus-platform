name: CI

on:
  push:
    branches: [ main, po2 ]
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (npm ci if lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm i --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            echo "No JS lockfile at repo root"; exit 0
          fi

      - name: Type check (if script exists)
        run: |
          if jq -e '.scripts.typecheck' package.json >/dev/null 2>&1; then
            npm run typecheck || true
          else
            echo "no typecheck script"
          fi

      - name: Lint (if script exists)
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null 2>&1; then
            npm run lint || true
          else
            echo "no lint script"
          fi

      - name: Build (if script exists)
        run: |
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then
            npm run build || true
          else
            echo "no build script"
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # tooling
          pip install ruff black pytest

      - name: Lint (ruff + black --check)
        run: |
          ruff check .
          black --check .

      - name: Run tests (if any)
        env:
          PYTHONPATH: backend
        run: |
          if ls -1 backend/tests 2>/dev/null | grep -q .; then
            pytest -q
          else
            echo "no tests"
          fi