# .github/workflows/ci.yml
name: Continuous Integration

on:
  push:
    branches: [ main, po2 ]
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    # `working-directory` belongs under `defaults.run`
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # where the lockfile is for caching
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack (pnpm / yarn)
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm --version || (npm i -g pnpm && pnpm --version)
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack prepare yarn@stable --activate
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found in ./frontend" && exit 1
          fi

      - name: Type check
        run: |
          if jq -e '.scripts["typecheck"]' package.json >/dev/null 2>&1; then
            pnpm run typecheck || yarn run typecheck || npm run typecheck || true
          else
            npx tsc -v || echo "tsc not found (skipping)"
          fi

      - name: Lint
        run: |
          if jq -e '.scripts["lint"]' package.json >/dev/null 2>&1; then
            pnpm run lint || yarn run lint || npm run lint
          else
            echo "No lint script (skipping)"
          fi

      - name: Build
        run: |
          if jq -e '.scripts["build"]' package.json >/dev/null 2>&1; then
            pnpm run build || yarn run build || npm run build
          else
            echo "No build script (skipping)"
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Dev tools for CI
          pip install ruff black pytest

      - name: Lint
        run: |
          ruff --output-format=github .
          black --check .

      - name: Run tests
        run: |
          if [ -d tests ] || ls -1 *_test.py tests 2>/dev/null | grep -q '.'; then
            pytest -q
          else
            echo "No tests found, skipping pytest"
          fi
          