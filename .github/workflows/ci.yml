name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------
      # Backend (FastAPI)
      # -----------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Pin CI tooling for reproducibility
          pip install ruff==0.6.9 black==24.10.0 pytest==8.3.3

      - name: Backend lint
        working-directory: backend
        run: |
          ruff check .
          black --check .

      - name: Backend unit tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests/ -q

      # -----------------
      # Frontend (Next.js)
      # -----------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run lint

      - name: Frontend unit tests
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm test -- --ci

      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon_placeholder_key
          NEXT_PUBLIC_BACKEND_URL: https://example.com
          NEXT_PUBLIC_DISABLE_AUTH: '1'
        run: npm run build
