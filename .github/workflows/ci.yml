name: Continuous Integration

on:
  push:
    branches: [ main, po2 ]
  pull_request:

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found in repo root" && exit 1
          fi

      - name: Type check
        run: |
          if jq -e '.scripts["typecheck"]' package.json > /dev/null; then
            pnpm run typecheck || yarn run typecheck || npm run typecheck || true
          else
            npx tsc -v || echo "tsc not found"
          fi

      - name: Lint
        run: |
          if jq -e '.scripts["lint"]' package.json > /dev/null; then
            pnpm run lint || yarn run lint || npm run lint
          else
            echo "No lint script, skipping"
          fi

      - name: Build
        run: |
          if jq -e '.scripts["build"]' package.json > /dev/null; then
            pnpm run build || yarn run build || npm run build
          else
            echo "No build script, skipping"
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No backend/requirements.txt found"; fi

      - name: Lint
        run: |
          ruff --output-format=github .
          black --check .
          isort --check-only .

      - name: Run tests
        run: |
          if [ -d tests ] || compgen -G "tests/**/*_test.py" > /dev/null || compgen -G "*_test.py" > /dev/null; then
            pytest -q
          else
            echo "No tests found, skipping pytest"
          fi
          