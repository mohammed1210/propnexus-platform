name: Deployment Preview

on:
  pull_request:

jobs:
  verify-deploy:
    name: Verify Deployment
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ secrets.API_BASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up shell
        run: echo "Using API_BASE=${API_BASE}"
      - name: Run verify script
        if: env.API_BASE != ''
        run: |
          chmod +x scripts/verify-deploy.sh
          bash scripts/verify-deploy.sh "$API_BASE"
      - name: Comment verification result
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const apiBase = process.env.API_BASE
            const message = apiBase
              ? 'Deployment verification completed.'
              : 'No API_BASE configured; skipped deployment verification.'
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })
            