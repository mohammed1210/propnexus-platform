name: ML Rerank Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ml-rerank:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest xgboost

      - name: Train tiny sample model
        run: |
          mkdir -p models
          python - <<'PY'
          import xgboost as xgb

          X = [
              [1.0, 0.9, 0.2, 12.0, 2.0, 7.2],
              [0.0, 0.2, 0.8, 3.0, 4.0, 2.0],
              [0.0, 0.1, 0.6, 90.0, 1.0, 1.1],
              [1.0, 0.88, 0.3, 20.0, 3.0, 6.8],
              [0.0, 0.24, 0.7, 5.0, 2.0, 2.4],
              [0.0, 0.08, 0.4, 120.0, 1.0, 1.0],
          ]
          y = [1, 0, 0, 1, 0, 0]
          group = [3, 3]

          model = xgb.sklearn.XGBRanker(
              objective="rank:ndcg",
              n_estimators=30,
              max_depth=4,
              learning_rate=0.2,
              random_state=42,
          )
          model.fit(X, y, group=group, verbose=False)
          model.save_model("models/search_rerank.json")
          PY

      - name: Run ML tests
        run: |
          pytest -q tests/ml backend/tests/test_search_api_v1.py
