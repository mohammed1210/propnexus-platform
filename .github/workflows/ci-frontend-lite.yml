name: CI – Frontend Build (lite)

on:
  pull_request:
    branches: [ "main", "sprint-*" ]
  push:
    branches: [ "sprint-*" ]

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm i
      - run: NEXT_TELEMETRY_DISABLED=1 npm run build --if-present
