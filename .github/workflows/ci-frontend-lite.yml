name: CI – Frontend Lite

on:
  push:
    branches: [ main, sprint-* ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Verify jose installed
        run: node -e "console.log('✅ jose version:', require('jose/package.json').version)"

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
