name: Release Smoke

on:
  workflow_dispatch:
  push:
    branches: [ sprint-9/payments-magiclink ]

jobs:
  stripe-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    if: ${{ vars.NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Stripe smoke check (no secrets)
        env:
          NEXT_PUBLIC_APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_BASE_URL }}
          NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS: ${{ vars.NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS }}
        run: |
          if [ -z "${NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS}" ]; then
            echo "ℹ️ No price IDs configured – skipping stripe-check."; exit 0; fi
          node ops/smoke/stripe-check.mjs || { echo "⚠️ Stripe smoke failed – soft pass"; exit 0; }
