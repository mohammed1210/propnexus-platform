name: Release smoke (pricing + stripe)

on:
  push:
    branches:
      - main
      - "sprint-*"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_BASE_URL: ${{ vars.NEXT_PUBLIC_APP_BASE_URL }}
      NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS: ${{ vars.NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Stripe env check (no secrets in logs)
        run: |
          node -e "
            const allowed=(process.env.NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS||'').split(',').map(s=>s.trim()).filter(Boolean);
            if(!allowed.length){ console.error('❌ missing NEXT_PUBLIC_STRIPE_ALLOWED_PRICE_IDS'); process.exit(1); }
            if(!process.env.STRIPE_SECRET_KEY){ console.error('❌ missing STRIPE_SECRET_KEY'); process.exit(1); }
            console.log('✅ Stripe envs present,', allowed.length, 'price ids configured');
          "

      - name: Run ops smoke tests
        run: node ops/smoke/stripe-check.mjs