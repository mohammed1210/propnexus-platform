name: Backend CI

on:
  push:
    branches: [ main, po2 ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Make 'import main' from tests work
      PYTHONPATH: backend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # tools for CI
          pip install ruff black pytest

      - name: Lint (ruff + black --check)
        run: |
          ruff check .
          black --check .

      - name: Run tests (if any)
        run: |
          if ls -1 *_test.py tests 2>/dev/null | grep -q '.'; then
            pytest -q
          else
            echo "no tests found; skipping"
          fi