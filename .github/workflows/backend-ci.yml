name: Backend CI

on:
  push:
    branches: [ main, po2 ]
  pull_request:

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Ensure test and lint tools available
          pip install ruff black pytest httpx uvicorn

      - name: Lint (Ruff + Black)
        working-directory: backend
        run: |
          echo "🔍 Running Ruff and Black checks..."
          ruff check .
          black --check .

      - name: Run tests
        working-directory: backend
        env:
          PYTHONPATH: backend
        run: |
          if ls -1 *_test.py tests 2>/dev/null | grep -q '.'; then
            echo "⚙️ Running pytest..."
            pytest -q
          else
            echo "No tests found, skipping pytest."
          fi

      - name: Backend Sanity Smoke Test
        working-directory: backend
        env:
          PYTHONPATH: backend
        run: |
          echo "🚀 Launching FastAPI app for health check..."
          uvicorn main:app --port 8000 --host 127.0.0.1 --log-level warning &
          sleep 5
          echo "🔍 Checking /health endpoint..."
          curl -f http://127.0.0.1:8000/health | tee health_response.json
          pkill -f "uvicorn" || true
          echo "✅ Sanity test passed"