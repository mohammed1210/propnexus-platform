name: Backend CI

on:
  push:
    branches: [ main, po2, sprint-*, po* ]
    paths:
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Pin tools for reproducible CI
          pip install ruff==0.6.9 black==24.10.0 pytest==8.3.3

      - name: Lint (ruff + black --check)
        working-directory: backend
        run: |
          ruff check .
          black --check .

      - name: Run backend contract + schema guardrail tests
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Run all backend tests, including contracts + schema guardrails
          pytest tests/test_contracts.py
          pytest tests/test_schema_contracts_guardrail.py