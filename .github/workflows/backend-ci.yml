name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: ["main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # helpful dev tools; comment out if you prefer
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint (ruff) – optional
        run: ruff check . || true

      - name: Type check (mypy) – optional
        run: mypy . || true

      - name: Run tests – optional
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://wsfemkhxttddztnhthkc.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzZmVta2h4dHRkZHp0bmh0aGtjIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1MDk1NzUwNCwiZXhwIjoyMDY2NTMzNTA0fQ.ZE0B_yJUFO88oZ4OU7SDLQ2WHXIEwWC7mbKHdMb6BW4' }}
        run: pytest -q || true
