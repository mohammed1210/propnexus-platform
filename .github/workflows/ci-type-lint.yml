name: CI – Typecheck & Lint

on:
  pull_request:
    branches: ['main', 'sprint-*']
  push:
    branches: ['sprint-*']

jobs:
  type_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci || npm i
      - run: npx tsc --noEmit || true
      - run: npx next lint || true
