name: Deploy Backend (Railway)

on:
  push:
    branches:
      - po2
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      # Deploy from the REPO ROOT so /app/backend exists in the image
      - name: Deploy with Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "propnexus-backend" \
            --path "." \
            --environment production \
            --ci \
            --detach

      - name: Wait for health
        env:
          URL: https://propnexus-backend-production.up.railway.app/health
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Health attempt $i -> $code"
            if [ "$code" = "200" ]; then
              echo "✅ Healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1

      # Minimal Python setup so the import sanity check can run
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps (for sanity check only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Backend deps (sanity check)
        run: |
          python -V
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("main", "main.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert hasattr(mod, "app"), "FastAPI 'app' not exported by main.py"
          print("✓ FastAPI app found")
          PY