name: Deploy Backend (Railway)

on:
  push:
    branches: [ main, sprint-*, po*, copilot/* ]
    paths:
      - "backend/**"
      - "railway.toml"
      - "scripts/railway-start.sh"
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_SERVICE: propnexus-backend
      RAILWAY_WORKER_SERVICE: function-bun
      WORKER_SCRAPER_MODE: direct
      WORKER_SCRAPERAPI_ALLOW_FALLBACK: "false"
      WORKER_INGEST_SOURCES: zoopla,onthemarket,spareroom
      WORKER_INGEST_INTERVAL_SECONDS: "900"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp app version
        run: |
          echo "${GITHUB_SHA}" > backend/.app_version

      - name: Secrets sanity check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN not configured"
            exit 1
          fi

      - name: Install Railway CLI
        run: |
          set -euo pipefail

          # Primary install method.
          if curl -fsSL https://railway.app/install.sh | sh; then
            echo "$HOME/.railway/bin" >> $GITHUB_PATH
            if [ -f "$HOME/.railway/env" ]; then
              source "$HOME/.railway/env"
            else
              export PATH="$HOME/.railway/bin:$PATH"
            fi
          else
            # Fallback: GitHub may be unreachable from the runner, which breaks the install script.
            # Using npm avoids fetching the release asset from GitHub.
            echo "⚠️ Railway install script failed; falling back to npm install"
            npm install -g @railway/cli
            echo "$(npm bin -g)" >> $GITHUB_PATH
          fi

          railway --version

      - name: Report Railway deployment targets
        run: |
          echo "Railway API deploy target: $RAILWAY_API_SERVICE"
          echo "Railway ingest worker deploy target: $RAILWAY_WORKER_SERVICE"
          echo "Worker scraper mode: $WORKER_SCRAPER_MODE"
          echo "ScraperAPI fallback: disabled"

      - name: Deploy with Railway
        id: deploy_api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying PropNexus backend API to Railway service: $RAILWAY_API_SERVICE"
          railway up \
            --service "$RAILWAY_API_SERVICE" \
            --ci \
            --json
          echo "PropNexus backend API deployment complete: $RAILWAY_API_SERVICE"

      - name: List Railway services
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service list

      - name: Configure ingest worker variables
        id: configure_worker_env
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "❌ SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY GitHub secrets are required for the ingest worker"
            exit 1
          fi

          echo "Seeding ingest worker environment for Railway service: $RAILWAY_WORKER_SERVICE"
          railway variable set "SUPABASE_URL=$SUPABASE_URL" --service "$RAILWAY_WORKER_SERVICE" --skip-deploys
          railway variable set "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" --service "$RAILWAY_WORKER_SERVICE" --skip-deploys
          railway variable set "SCRAPER_MODE=$WORKER_SCRAPER_MODE" --service "$RAILWAY_WORKER_SERVICE" --skip-deploys
          railway variable set "SCRAPERAPI_ALLOW_FALLBACK=$WORKER_SCRAPERAPI_ALLOW_FALLBACK" --service "$RAILWAY_WORKER_SERVICE" --skip-deploys
          railway variable set "INGEST_SOURCES=$WORKER_INGEST_SOURCES" --service "$RAILWAY_WORKER_SERVICE" --skip-deploys
          railway variable set "INGEST_INTERVAL_SECONDS=$WORKER_INGEST_INTERVAL_SECONDS" --service "$RAILWAY_WORKER_SERVICE" --skip-deploys
          echo "Ingest worker environment seeded successfully for service: $RAILWAY_WORKER_SERVICE"

      - name: Deploy ingest worker with Railway
        id: deploy_worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying PropNexus ingest worker to Railway service: $RAILWAY_WORKER_SERVICE"
          railway up \
            --service "$RAILWAY_WORKER_SERVICE" \
            --ci \
            --json
          echo "PropNexus ingest worker deployment complete: $RAILWAY_WORKER_SERVICE"

      - name: Verify ingest worker startup logs
        id: verify_worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          for i in {1..18}; do
            logs="$(railway logs --service "$RAILWAY_WORKER_SERVICE" --latest --deployment --lines 160 2>&1 || true)"
            printf '%s\n' "$logs"

            if printf '%s\n' "$logs" | grep -q "\[ingest-worker\] starting" \
              && printf '%s\n' "$logs" | grep -q "\[ingest-worker\] scraper_mode=direct" \
              && printf '%s\n' "$logs" | grep -q "\[ingest-worker\] supabase_configured=True" \
              && printf '%s\n' "$logs" | grep -q "\[ingest-worker\] sources="; then
              echo "✅ ingest worker startup diagnostics found"
              echo "PropNexus ingest worker verified healthy: $RAILWAY_WORKER_SERVICE"
              exit 0
            fi

            echo "Waiting for ingest worker startup logs (attempt $i/18)..."
            sleep 10
          done

          echo "❌ ingest worker startup diagnostics were not found in latest Railway logs"
          exit 1

      - name: Wait for expected deployed version
        id: verify_api
        env:
          URL: https://propnexus-backend-production.up.railway.app/health
          EXPECT_SHA: ${{ github.sha }}
        run: |
          expect_short="${EXPECT_SHA:0:7}"

          # Railway can report the build as scheduled before the new container is live.
          # Keep this window long enough for dependency-heavy backend builds without
          # marking successful deploys as failed prematurely.
          for i in {1..90}; do
            payload=$(curl -fsSL "$URL" 2>/dev/null || true)

            if [ -z "$payload" ]; then
              echo "Version attempt $i -> no payload yet"
              sleep 10
              continue
            fi

            actual=$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')
            status=$(printf '%s' "$payload" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
            echo "Version attempt $i -> status=${status:-unknown} version=${actual:-missing}"

            if [ -z "$actual" ]; then
              sleep 10
              continue
            fi

            if [ "$actual" = "$EXPECT_SHA" ] || [ "$actual" = "$expect_short" ] || [ "${actual#${EXPECT_SHA}}" != "$actual" ] || [ "${EXPECT_SHA#$actual}" != "$EXPECT_SHA" ]; then
              echo "✅ Deployed version matches commit"
              exit 0
            fi

            sleep 10
          done

          echo "❌ Deployed version did not advance to this commit ($EXPECT_SHA) in time"
          exit 1

      - name: Railway deployment summary
        if: always()
        run: |
          {
            echo "## Railway deployment summary"
            echo ""
            echo "- PropNexus backend API target: $RAILWAY_API_SERVICE"
            echo "- PropNexus backend API deployment: ${{ steps.deploy_api.outcome }}"
            echo "- PropNexus backend API version check: ${{ steps.verify_api.outcome }}"
            echo "- PropNexus ingest worker target: $RAILWAY_WORKER_SERVICE"
            echo "- PropNexus ingest worker environment seed: ${{ steps.configure_worker_env.outcome }}"
            echo "- PropNexus ingest worker deployment: ${{ steps.deploy_worker.outcome }}"
            echo "- PropNexus ingest worker startup verification: ${{ steps.verify_worker.outcome }}"
            echo "- Worker scraper mode: $WORKER_SCRAPER_MODE"
            echo "- ScraperAPI fallback: disabled"
          } | tee -a "$GITHUB_STEP_SUMMARY"
