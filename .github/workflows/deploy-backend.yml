name: Deploy Backend (Railway)

on:
  push:
    branches: [ main, sprint-*, po*, copilot/* ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets sanity check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "ℹ️ RAILWAY_TOKEN not configured – skipping deploy (soft pass)."
            exit 0
          fi

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy with Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "propnexus-backend" \
            --ci \
            --json

      - name: Wait for health
        env:
          URL: https://propnexus-backend-production.up.railway.app/health
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Health attempt $i -> $code"
            [ "$code" = "200" ] && echo "✅ Healthy" && exit 0
            sleep 5
          done
          echo "❌ Health check never reached 200"
          exit 1

      - name: Verify deployed version
        env:
          URL: https://propnexus-backend-production.up.railway.app/health
          EXPECT_SHA: ${{ github.sha }}
        run: |
          actual=$(curl -fsSL "$URL" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))')
          echo "Deployed version: $actual"
          if [ -z "$actual" ]; then
            echo "❌ /health did not include a version"
            exit 1
          fi
          expect_short="${EXPECT_SHA:0:7}"

          if [ "$actual" = "$EXPECT_SHA" ] || [ "$actual" = "$expect_short" ] || [ "${actual#${EXPECT_SHA}}" != "$actual" ] || [ "${EXPECT_SHA#$actual}" != "$EXPECT_SHA" ]; then
            echo "✅ Deployed version matches commit"
            exit 0
          fi

          echo "❌ Deployed version does not match this commit ($EXPECT_SHA)"
          exit 1
