# Railway config for the PropNexus backend (FastAPI / Python)

# Use Nixpacks (Python) to build
[build]
builder = "NIXPACKS"

# Deploy/start configuration
[deploy]
# Start FastAPI with Uvicorn; Railway injects $PORT
startCommand = "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Build from the /backend directory
[service]
rootDirectory = "backend"

# Handy defaults
[variables]
PYTHONUNBUFFERED = "1"
