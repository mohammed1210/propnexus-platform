# Railway config for PropNexus – Backend (FastAPI)
# Build the Python backend and run uvicorn from the backend package.

[build]
builder = "NIXPACKS"
# Install backend deps and frontend deps during build.
# Use npm ci instead of yarn to avoid relying on yarn being present.
buildCommand = "pip3 install -r backend/requirements.txt && cd frontend && npm ci"

[deploy]
# Run FastAPI (backend.main:app) on the provided PORT
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port 8000"
# FastAPI health route
healthcheckPath = "/health"

[env]
# Let Nixpacks choose Python, but ensure version if needed
PYTHON_VERSION = "3.12.3"
NODE_ENV = "production"
