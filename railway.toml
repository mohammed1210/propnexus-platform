# railway.toml
# ─────────────────────────────────────────────────────────────────────────────
# DEFAULT SERVICE (what you already had): runs ./scripts/cron-ingest.sh
# Uses a no-op build (we're not building Next.js here), and a daily CSV ingest.
# ─────────────────────────────────────────────────────────────────────────────
[build]
builder = "NIXPACKS"
buildCommand = "echo skip-next-build"

[deploy]
startCommand = "bash -lc './scripts/cron-ingest.sh'"

[cron]
schedule = "0 6 * * *"                  # every day at 06:00 UTC
command  = "npm --prefix . run ingest:csv"

[env]
NODE_ENV = "production"
