# railway.toml

[build]
# We don’t need a Dockerfile – force Railway to use Nixpacks
builder = "NIXPACKS"

[deploy]
# Don’t run a webserver – just our cron ingestion worker
startCommand = "bash -lc './scripts/cron-ingest.sh'"

[cron]
# Run ingestion every day at 3am UTC
# You can adjust timing (e.g. every 6 hours: "0 */6 * * *")
schedule = "0 3 * * *"

# Run the ingest script from the repo root, even if cron executes in /scripts
command = "npm --prefix .. run ingest:csv"

[env]
NODE_ENV = "production"