# railway.toml

[build]
# Force Railway to use Nixpacks (no Dockerfile needed)
builder = "NIXPACKS"

[deploy]
# Boot the worker by running our cron shell script from repo root
startCommand = "bash -lc './scripts/cron-ingest.sh'"

[cron]
# Run ingestion every day at 03:00 UTC (adjust as you like)
schedule = "0 3 * * *"
# Call the root package’s script (no .env file in Railway; it uses service vars)
command = "npm --prefix . run ingest:csv --silent"

[env]
NODE_ENV = "production"