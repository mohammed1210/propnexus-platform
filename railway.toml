# Railway config for PropNexus – Backend (FastAPI)
# Build the Python backend and run uvicorn from the backend package.

[build]
builder = "NIXPACKS"
# Install backend deps.
buildCommand = "pip3 install -r backend/requirements.txt && python3 -m playwright install --with-deps chromium"

[deploy]
# Dispatch API and worker services from one repo. The ingest-worker service is
# detected via Railway service/process env and runs python -m backend.tasks.ingestion_runner.
startCommand = "bash scripts/railway-start.sh"
# FastAPI health route. The ingest worker also exposes a tiny /health responder
# when Railway provides PORT so the same service config can deploy both shapes.
healthcheckPath = "/health"

[env]
# Let Nixpacks choose Python, but ensure version if needed
PYTHON_VERSION = "3.12.3"
NODE_ENV = "production"
