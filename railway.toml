# railway.toml

[build]
builder = "NIXPACKS"
# make the build step a no-op for the worker
buildCommand = "echo skip-next-build"

[deploy]
# run our cron wrapper from the repo root
startCommand = "bash -lc './scripts/cron-ingest.sh'"

[cron]
# schedule is fine; adjust if you want
schedule = "0 6 * * *"
# call the root package script explicitly
command = "npm --prefix . run ingest:live"

[env]
NODE_ENV = "production"