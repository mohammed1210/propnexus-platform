# railway.toml — single Python service for the backend

[build]
# Use Railway's (still supported) Nixpacks to detect Python from requirements.txt
builder = "NIXPACKS"

# Optional: pin Python version used by Nixpacks
[build.env]
NIXPACKS_PYTHON_VERSION = "3.12"

# ------------------------------------------------------------------------------
# Backend service
# ------------------------------------------------------------------------------
[[services]]
name = "propnexus-backend"
root = "./backend"

# Make sure dependencies install during build
buildCommand = "pip install -r requirements.txt"

# Start the FastAPI app with uvicorn
start = "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"

# Optional healthcheck (FastAPI exposes /health)
[services.healthcheck]
path = "/health"
interval = 10
timeout = 5
retries = 6
