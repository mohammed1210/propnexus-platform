[project]
name = "propnexus-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "aiohttp>=3.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  "node_modules",
  ".venv",
  "backend/.venv",
  "dist",
  "build",
  "__pycache__",
  "frontend/node_modules",
]

[tool.ruff.lint]
# F = pyflakes, E/W = pycodestyle
select = ["F", "E", "W"]

# Ignore:
# E501 = line length (handled by black)
# W291 = trailing whitespace
# W293 = blank line contains whitespace
ignore = ["E501", "W291", "W293"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 100
target-version = ["py312"]
