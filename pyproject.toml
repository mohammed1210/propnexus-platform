[tool.ruff]
line-length = 100
target-version = "py312"
# Common lint sets: F (pyflakes), E,W (pycodestyle)
lint.select = ["F", "E", "W"]
lint.ignore = ["E501"]  # line length (Black handles wrapping; keep off if you prefer)
exclude = [".git", "node_modules", ".venv", "backend/.venv", "dist", "build"]
extend-exclude = ["**/*.py.bak", "__pycache__", "frontend/node_modules"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 100
target-version = ["py312"]
