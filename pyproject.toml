[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  "node_modules",
  ".venv",
  "backend/.venv",
  "dist",
  "build",
  "__pycache__",
  "frontend/node_modules",
]

[tool.ruff.lint]
select = ["F", "E", "W"]
ignore = ["E501", "W291", "W293"]

# Optional but handy: ignore unused imports in __init__.py files
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py312"]
